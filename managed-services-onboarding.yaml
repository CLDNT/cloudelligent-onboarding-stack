# GENERATED by backend/scripts/generate-forwarding-template.ts from
# backend/packages/shared/src/forwarding/rules.ts — do not edit by hand
# (forwarding-template-parity.test.ts fails on any difference).
#
# ProductX Managed Services event-forwarding ADD-ON stack, v3 (RT-F).
#   Stack name: CloudOps-ManagedServices-Forwarding. Separate from the base
#   CloudOps-Onboarding stack (wafr-role.yaml), which this never touches.
#   Activation = create-stack; deactivation = delete-stack; a new version =
#   update-stack with the new template URL. Rollback = update back to the
#   previous version's URL (cfn/managed-services-forwarding-v<N-1>.yaml).
#
#   Minimum necessary: every rule feeds a seed routing rule whose workflow
#   ships, or the lake — see each rule's Description and docs/phase4/mvpV1.6/specs/RT-F-spec.md §2.
#   Rules run in every region of ForwardRegions (us-east-1 always), deployed
#   by StackSets; the home region holds only the roles and the StackSets.
#
#   v3 adds the Config item and compliance rules for the CloudOS lake, a scoped
#   recorder only in CreateRecorderRegions (an existing recorder is never changed)
#   and a budget alarm. Those three do not feed a seed rule.
AWSTemplateFormatVersion: "2010-09-09"
Description: "ProductX Managed Services event-forwarding add-on v3. Forwards the minimum the shipped workflows need (GuardDuty, Security Hub, Macie, incident-grade CloudTrail calls, successful root sign-ins, CloudWatch alarms, RDS, Health issues, failed backups, Config item and compliance changes, SSM compliance) from every region in ForwardRegions to the ProductX platform bus. Creates a forwarding role scoped to events:PutEvents on that bus, and StackSet roles scoped to ProductXAgent* rules. Creates a scoped AWS Config recorder only in CreateRecorderRegions, and never changes an existing recorder. Adds a budget alarm at 125% of the onboarding estimate. Set EnableOrganizations=yes to roll the same rules out to the member accounts of the targeted OUs."
Parameters:
  ProductXBusArn:
    Type: String
    AllowedPattern: "^arn:aws[a-z-]*:events:[a-z0-9-]+:[0-9]{12}:event-bus/[A-Za-z0-9._-]+$"
    ConstraintDescription: "Must be the ProductX EventBridge bus ARN (arn:aws:events:<region>:<account>:event-bus/<name>)."
    Description: "ARN of the ProductX EventBridge bus that receives this account's events. Required."
  ForwardRegions:
    Type: CommaDelimitedList
    Description: "Regions to forward from, comma-separated. ProductX fills in the account's enabled regions. You may remove regions you do not use; us-east-1 is always required (global-service events arrive only there)."
  SecurityHubRegion:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z]{2}(-[a-z]+)+-[0-9]$"
    ConstraintDescription: "Must be empty or a region name such as eu-west-1."
    Description: "Your Security Hub finding aggregation region, when you use cross-region aggregation (ProductX fills it in). Security Hub findings are then forwarded from that region only, so each finding arrives once. Empty = every region."
  CreateRecorderRegions:
    Type: CommaDelimitedList
    Default: ""
    Description: "Regions that get a scoped AWS Config recorder and delivery channel (ProductX fills these in: only regions with no recorder of their own, plus any this stack already created). Removing a region deletes the recorder this stack created there. Existing recorders are never changed."
  OnboardingEstimateUsd:
    Type: Number
    Default: 400
    MinValue: 1
    Description: "This account's monthly AWS Config estimate from onboarding, in USD. The budget alarm fires at 125% of it."
  CreateBudgetAlarm:
    Type: String
    Default: "yes"
    AllowedValues:
      - "yes"
      - "no"
    Description: "Set to 'no' when an organization service control policy denies AWS Budgets in this account (the budget alarm would fail the stack with AccessDenied). 'no' creates no budget, alarm topic or email subscription."
  BudgetAlertEmail:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[^@\\s]+@[^@\\s]+$"
    ConstraintDescription: "Must be empty or an email address."
    Description: "Optional. An address to email when the budget alarm fires (it confirms the subscription). Empty = the alarm goes to the stack's SNS topic only."
  EnableOrganizations:
    Type: String
    Default: "no"
    AllowedValues:
      - "yes"
      - "no"
    Description: "Set to 'yes' if this account is an AWS Organizations management account and you want forwarding rules on member accounts too. Requires CloudFormation StackSets trusted access. Leave 'no' for single-account."
  TargetOUs:
    Type: String
    Default: ""
    AllowedPattern: "^$|^(ou|r)-[a-z0-9-]+(,(ou|r)-[a-z0-9-]+)*$"
    ConstraintDescription: "Must be empty (single-account mode) or a comma-separated list of OU ids starting with ou- or r- (e.g. r-abc1 or ou-abc1-12abcdef,ou-abc1-34ghijkl)."
    Description: "REQUIRED when EnableOrganizations=yes. Organizational Unit IDs to roll forwarding rules into."
  Environment:
    Type: String
    AllowedPattern: "^[a-z][a-z0-9-]*$"
    ConstraintDescription: "Must be the ProductX environment name ProductX shows (lowercase)."
    Description: "Value for the Environment tag on every resource this stack creates. Required — enter the value ProductX shows."
  Owner:
    Type: String
    Default: engineering
    Description: "Value for the Owner tag on every resource this stack creates."
Rules:
  TargetOUsRequiredForOrg:
    RuleCondition:
      Fn::Equals:
        - Ref: EnableOrganizations
        - "yes"
    Assertions:
      - Assert:
          Fn::Not:
            - Fn::Equals:
                - Ref: TargetOUs
                - ""
        AssertDescription: "TargetOUs is required when EnableOrganizations=yes."
  AlwaysForwardedRegions:
    Assertions:
      - Assert:
          Fn::Contains:
            - Ref: ForwardRegions
            - us-east-1
        AssertDescription: "ForwardRegions must include us-east-1: global-service CloudTrail calls, global Health events and most root sign-ins arrive only there."
  SecurityHubRegionIsForwarded:
    RuleCondition:
      Fn::Not:
        - Fn::Equals:
            - Ref: SecurityHubRegion
            - ""
    Assertions:
      - Assert:
          Fn::Contains:
            - Ref: ForwardRegions
            - Ref: SecurityHubRegion
        AssertDescription: "SecurityHubRegion must be one of ForwardRegions, or Security Hub findings are forwarded from nowhere."
Conditions:
  IsOrg:
    Fn::Equals:
      - Ref: EnableOrganizations
      - "yes"
  HasRecorderRegions:
    Fn::Not:
      - Fn::Equals:
          - Fn::Join:
              - ""
              - Ref: CreateRecorderRegions
          - ""
  CreateBudget:
    Fn::Equals:
      - Ref: CreateBudgetAlarm
      - "yes"
  HasBudgetAlertEmail:
    Fn::And:
      - Condition: CreateBudget
      - Fn::Not:
          - Fn::Equals:
              - Ref: BudgetAlertEmail
              - ""
Resources:
  EventBridgeForwardRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: "CloudOpsEventBridgeForward-${AWS::AccountId}"
      Tags:
        - Key: Project
          Value: productx
        - Key: Environment
          Value:
            Ref: Environment
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value:
            Ref: Owner
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount:
                  Ref: AWS::AccountId
              ArnLike:
                aws:SourceArn:
                  Fn::Sub: "arn:${AWS::Partition}:events:*:${AWS::AccountId}:rule/ProductXAgent*"
      Policies:
        - PolicyName: CrossAccountPutEvents
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: events:PutEvents
                Resource:
                  Ref: ProductXBusArn
  StackSetAdministrationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: "CloudOpsForwardingStackSetAdmin-${AWS::AccountId}"
      Tags:
        - Key: Project
          Value: productx
        - Key: Environment
          Value:
            Ref: Environment
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value:
            Ref: Owner
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount:
                  Ref: AWS::AccountId
      Policies:
        - PolicyName: AssumeForwardingStackSetExecution
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sts:AssumeRole
                Resource:
                  - Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CloudOpsForwardingStackSetExec-${AWS::AccountId}"
                  - Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CloudOpsRecorderStackSetExec-${AWS::AccountId}"
  StackSetExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: "CloudOpsForwardingStackSetExec-${AWS::AccountId}"
      Tags:
        - Key: Project
          Value: productx
        - Key: Environment
          Value:
            Ref: Environment
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value:
            Ref: Owner
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                Fn::GetAtt:
                  - StackSetAdministrationRole
                  - Arn
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ForwardingRulesOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ProductXAgentRules
                Effect: Allow
                Action:
                  - events:PutRule
                  - events:PutTargets
                  - events:DeleteRule
                  - events:RemoveTargets
                  - events:DescribeRule
                  - events:ListTargetsByRule
                  - events:TagResource
                  - events:UntagResource
                  - events:ListTagsForResource
                Resource:
                  Fn::Sub: "arn:${AWS::Partition}:events:*:${AWS::AccountId}:rule/ProductXAgent*"
              - Sid: PassForwardingRoleToEventBridge
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CloudOpsEventBridgeForward-${AWS::AccountId}"
                Condition:
                  StringEquals:
                    iam:PassedToService: events.amazonaws.com
              - Sid: OwnStackInstances
                Effect: Allow
                Action: "cloudformation:*"
                Resource:
                  Fn::Sub: "arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/StackSet-CloudOpsForwardingRegional-*/*"
  ForwardingRegionalStackSet:
    Type: AWS::CloudFormation::StackSet
    DependsOn:
      - EventBridgeForwardRole
      - StackSetExecutionRole
    Properties:
      StackSetName: CloudOpsForwardingRegional
      Description: "ProductX event-forwarding rules in every forwarded region of this account."
      Tags:
        - Key: Project
          Value: productx
        - Key: Environment
          Value:
            Ref: Environment
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value:
            Ref: Owner
      ManagedExecution:
        Active: true
      PermissionModel: SELF_MANAGED
      AdministrationRoleARN:
        Fn::GetAtt:
          - StackSetAdministrationRole
          - Arn
      ExecutionRoleName:
        Fn::Sub: "CloudOpsForwardingStackSetExec-${AWS::AccountId}"
      OperationPreferences:
        RegionConcurrencyType: PARALLEL
        MaxConcurrentCount: 1
        FailureToleranceCount: 0
      Parameters:
        - ParameterKey: ProductXBusArn
          ParameterValue:
            Ref: ProductXBusArn
        - ParameterKey: SecurityHubRegion
          ParameterValue:
            Ref: SecurityHubRegion
      StackInstancesGroup:
        - DeploymentTargets:
            Accounts:
              - Ref: AWS::AccountId
          Regions:
            Ref: ForwardRegions
      TemplateBody: |
        AWSTemplateFormatVersion: "2010-09-09"
        Description: "ProductX Managed Services event forwarding v3: this region's rules (StackSet-deployed)."
        Parameters:
          ProductXBusArn:
            Type: String
          SecurityHubRegion:
            Type: String
            Default: ""
            Description: "The Security Hub finding aggregation region, or empty when the account has no aggregator."
        Conditions:
          ForwardSecurityHub:
            Fn::Or:
              - Fn::Equals:
                  - Ref: SecurityHubRegion
                  - ""
              - Fn::Equals:
                  - Ref: SecurityHubRegion
                  - Ref: AWS::Region
        Resources:
          GuardDutyFindingRule:
            Type: AWS::Events::Rule
            Properties:
              Name: ProductXAgentFwdGuardDuty
              Description: "Feeds: #1-#3 (Incident), #21 (Security findings). GuardDuty findings, severity 7 and above."
              State: ENABLED
              EventPattern:
                source:
                  - aws.guardduty
                detail-type:
                  - "GuardDuty Finding"
                detail:
                  severity:
                    - numeric:
                        - ">="
                        - 7
              Targets:
                - Id: ProductXBusTarget
                  Arn:
                    Ref: ProductXBusArn
                  RoleArn:
                    Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CloudOpsEventBridgeForward-${AWS::AccountId}"
          SecurityHubFindingRule:
            Type: AWS::Events::Rule
            Condition: ForwardSecurityHub
            Properties:
              Name: ProductXAgentFwdSecurityHub
              Description: "Feeds: #21 (Security findings). Critical and High Security Hub V2 findings in any status, so a resolved finding reaches the lake too, except copies of GuardDuty, Inspector and Macie findings (GuardDuty and Macie arrive natively; Inspector is not forwarded)."
              State: ENABLED
              EventPattern:
                source:
                  - aws.securityhub
                detail-type:
                  - "Findings Imported V2"
                detail:
                  findings:
                    severity:
                      - Critical
                      - High
                    metadata:
                      product:
                        name:
                          - anything-but:
                              - GuardDuty
                              - Inspector
                              - Macie
              Targets:
                - Id: ProductXBusTarget
                  Arn:
                    Ref: ProductXBusArn
                  RoleArn:
                    Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CloudOpsEventBridgeForward-${AWS::AccountId}"
          MacieFindingRule:
            Type: AWS::Events::Rule
            Properties:
              Name: ProductXAgentFwdMacie
              Description: "Feeds: #20 (record-only), #21 (Security findings). High-severity Macie findings."
              State: ENABLED
              EventPattern:
                source:
                  - aws.macie
                detail-type:
                  - "Macie Finding"
                detail:
                  severity:
                    description:
                      - High
              Targets:
                - Id: ProductXBusTarget
                  Arn:
                    Ref: ProductXBusArn
                  RoleArn:
                    Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CloudOpsEventBridgeForward-${AWS::AccountId}"
          CloudTrailIncidentRule:
            Type: AWS::Events::Rule
            Properties:
              Name: ProductXAgentFwdCloudTrail
              Description: "Feeds: #9, #10 (Incident). Detection switched off (8 calls) and KMS keys disabled or scheduled for deletion (2 calls), by anyone but an AWS service."
              State: ENABLED
              EventPattern:
                source:
                  - aws.cloudtrail
                  - aws.securityhub
                  - aws.guardduty
                  - aws.config
                  - aws.ec2
                  - aws.kms
                detail-type:
                  - "AWS API Call via CloudTrail"
                detail:
                  userIdentity:
                    type:
                      - anything-but: AWSService
                  eventName:
                    - StopLogging
                    - DeleteTrail
                    - DisableSecurityHub
                    - DeleteDetector
                    - StopConfigurationRecorder
                    - DeleteConfigurationRecorder
                    - DeleteDeliveryChannel
                    - DeleteFlowLogs
                    - ScheduleKeyDeletion
                    - DisableKey
              Targets:
                - Id: ProductXBusTarget
                  Arn:
                    Ref: ProductXBusArn
                  RoleArn:
                    Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CloudOpsEventBridgeForward-${AWS::AccountId}"
          RootSignInRule:
            Type: AWS::Events::Rule
            Properties:
              Name: ProductXAgentFwdRootSignIn
              Description: "Feeds: #11 (Incident). Successful ROOT console sign-ins only. CloudTrail records them in us-east-1, us-east-2 or us-west-2."
              State: ENABLED
              EventPattern:
                source:
                  - aws.signin
                detail-type:
                  - "AWS Console Sign In via CloudTrail"
                  - "AWS Console Signin via CloudTrail"
                detail:
                  eventName:
                    - ConsoleLogin
                  userIdentity:
                    type:
                      - Root
                  responseElements:
                    ConsoleLogin:
                      - Success
              Targets:
                - Id: ProductXBusTarget
                  Arn:
                    Ref: ProductXBusArn
                  RoleArn:
                    Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CloudOpsEventBridgeForward-${AWS::AccountId}"
          CloudWatchAlarmRule:
            Type: AWS::Events::Rule
            Properties:
              Name: ProductXAgentFwdCloudWatchAlarm
              Description: "Feeds: #4 (Incident, alarms chosen in Scope; OK from ALARM closes the card). Target-tracking alarms excluded."
              State: ENABLED
              EventPattern:
                source:
                  - aws.cloudwatch
                detail-type:
                  - "CloudWatch Alarm State Change"
                detail:
                  alarmName:
                    - anything-but:
                        prefix: TargetTracking-
                  "$or":
                    - state:
                        value:
                          - ALARM
                    - state:
                        value:
                          - OK
                      previousState:
                        value:
                          - ALARM
              Targets:
                - Id: ProductXBusTarget
                  Arn:
                    Ref: ProductXBusArn
                  RoleArn:
                    Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CloudOpsEventBridgeForward-${AWS::AccountId}"
          RdsEventRule:
            Type: AWS::Events::Rule
            Properties:
              Name: ProductXAgentFwdRds
              Description: "Feeds: #14-#16 (Incident). RDS failover and low-storage events and the storage-full shutdown (RDS-EVENT-0221/0222); failover completions are absorbed into the open incident card."
              State: ENABLED
              EventPattern:
                source:
                  - aws.rds
                detail-type:
                  - "RDS DB Instance Event"
                  - "RDS DB Cluster Event"
                detail:
                  "$or":
                    - EventCategories:
                        - failover
                        - "low storage"
                    - EventID:
                        - RDS-EVENT-0221
                        - RDS-EVENT-0222
              Targets:
                - Id: ProductXBusTarget
                  Arn:
                    Ref: ProductXBusArn
                  RoleArn:
                    Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CloudOpsEventBridgeForward-${AWS::AccountId}"
          HealthIssueRule:
            Type: AWS::Events::Rule
            Properties:
              Name: ProductXAgentFwdHealth
              Description: "Feeds: #8, #17 (Incident); #27 (record-only, closed at first sighting). AWS Health issues, plus every account risk (exposed or quarantined credentials) and abuse notice whatever its category; a later closed event closes the card."
              State: ENABLED
              EventPattern:
                source:
                  - aws.health
                detail-type:
                  - "AWS Health Event"
                  - "AWS Health Abuse Event"
                detail:
                  "$or":
                    - eventTypeCategory:
                        - issue
                    - service:
                        - RISK
                        - ABUSE
              Targets:
                - Id: ProductXBusTarget
                  Arn:
                    Ref: ProductXBusArn
                  RoleArn:
                    Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CloudOpsEventBridgeForward-${AWS::AccountId}"
          BackupJobRule:
            Type: AWS::Events::Rule
            Properties:
              Name: ProductXAgentFwdBackup
              Description: "Feeds: #18 (Incident, critical tags), #25 (Backup & recovery). Backup jobs failed, aborted or expired; copy jobs failed."
              State: ENABLED
              EventPattern:
                source:
                  - aws.backup
                detail-type:
                  - "Backup Job State Change"
                  - "Copy Job State Change"
                detail:
                  state:
                    - FAILED
                    - ABORTED
                    - EXPIRED
              Targets:
                - Id: ProductXBusTarget
                  Arn:
                    Ref: ProductXBusArn
                  RoleArn:
                    Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CloudOpsEventBridgeForward-${AWS::AccountId}"
          ConfigItemChangeRule:
            Type: AWS::Events::Rule
            Properties:
              Name: ProductXAgentFwdConfigItem
              Description: "Feeds: the lake (Bind: resources, facts, edge facts). Config item changes of the recorded types, oversized notifications included."
              State: ENABLED
              EventPattern:
                source:
                  - aws.config
                detail-type:
                  - "Config Configuration Item Change"
                detail:
                  messageType:
                    - ConfigurationItemChangeNotification
                    - OversizedConfigurationItemChangeNotification
                  "$or":
                    - configurationItem:
                        resourceType:
                          - AWS::EC2::Instance
                          - AWS::EC2::SecurityGroup
                          - AWS::EC2::Subnet
                          - AWS::EC2::VPC
                          - AWS::EC2::Volume
                          - AWS::EC2::RouteTable
                          - AWS::EC2::InternetGateway
                          - AWS::ElasticLoadBalancingV2::LoadBalancer
                          - AWS::ElasticLoadBalancingV2::Listener
                          - AWS::ElasticLoadBalancingV2::TargetGroup
                          - AWS::ACM::Certificate
                          - AWS::Lambda::Function
                          - AWS::RDS::DBInstance
                          - AWS::RDS::DBCluster
                          - AWS::ECS::Cluster
                          - AWS::ECS::Service
                          - AWS::ECS::TaskDefinition
                          - AWS::ApiGateway::RestApi
                          - AWS::ApiGateway::Stage
                          - AWS::ApiGatewayV2::Api
                          - AWS::ApiGatewayV2::Stage
                          - AWS::IAM::Role
                          - AWS::IAM::Policy
                    - configurationItemSummary:
                        resourceType:
                          - AWS::EC2::Instance
                          - AWS::EC2::SecurityGroup
                          - AWS::EC2::Subnet
                          - AWS::EC2::VPC
                          - AWS::EC2::Volume
                          - AWS::EC2::RouteTable
                          - AWS::EC2::InternetGateway
                          - AWS::ElasticLoadBalancingV2::LoadBalancer
                          - AWS::ElasticLoadBalancingV2::Listener
                          - AWS::ElasticLoadBalancingV2::TargetGroup
                          - AWS::ACM::Certificate
                          - AWS::Lambda::Function
                          - AWS::RDS::DBInstance
                          - AWS::RDS::DBCluster
                          - AWS::ECS::Cluster
                          - AWS::ECS::Service
                          - AWS::ECS::TaskDefinition
                          - AWS::ApiGateway::RestApi
                          - AWS::ApiGateway::Stage
                          - AWS::ApiGatewayV2::Api
                          - AWS::ApiGatewayV2::Stage
                          - AWS::IAM::Role
                          - AWS::IAM::Policy
              Targets:
                - Id: ProductXBusTarget
                  Arn:
                    Ref: ProductXBusArn
                  RoleArn:
                    Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CloudOpsEventBridgeForward-${AWS::AccountId}"
          ConfigComplianceChangeRule:
            Type: AWS::Events::Rule
            Properties:
              Name: ProductXAgentFwdConfigCompliance
              Description: "Feeds: the lake (compliance facts, both directions). Config rule compliance changes, except the rules Security Hub creates for its controls: those arrive as Security Hub findings."
              State: ENABLED
              EventPattern:
                source:
                  - aws.config
                detail-type:
                  - "Config Rules Compliance Change"
                detail:
                  configRuleName:
                    - anything-but:
                        prefix: securityhub-
              Targets:
                - Id: ProductXBusTarget
                  Arn:
                    Ref: ProductXBusArn
                  RoleArn:
                    Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CloudOpsEventBridgeForward-${AWS::AccountId}"
          SsmComplianceRule:
            Type: AWS::Events::Rule
            Properties:
              Name: ProductXAgentFwdSsmCompliance
              Description: "Feeds: the lake (patch and association compliance facts, both directions). SSM compliance state changes."
              State: ENABLED
              EventPattern:
                source:
                  - aws.ssm
                detail-type:
                  - "Configuration Compliance State Change"
                detail:
                  compliance-status:
                    - non_compliant
                    - compliant
              Targets:
                - Id: ProductXBusTarget
                  Arn:
                    Ref: ProductXBusArn
                  RoleArn:
                    Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CloudOpsEventBridgeForward-${AWS::AccountId}"
        Outputs:
          ForwardingVersion:
            Value: "3"
  ConfigDeliveryBucket:
    Type: AWS::S3::Bucket
    Condition: HasRecorderRegions
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Tags:
        - Key: Project
          Value: productx
        - Key: Environment
          Value:
            Ref: Environment
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value:
            Ref: Owner
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireConfigHistory
            Status: Enabled
            ExpirationInDays: 90
  ConfigDeliveryBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: HasRecorderRegions
    Properties:
      Bucket:
        Ref: ConfigDeliveryBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ConfigChecksTheBucket
            Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action:
              - s3:GetBucketAcl
              - s3:ListBucket
            Resource:
              Fn::GetAtt:
                - ConfigDeliveryBucket
                - Arn
            Condition:
              StringEquals:
                aws:SourceAccount:
                  Ref: AWS::AccountId
          - Sid: ConfigDelivers
            Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action: s3:PutObject
            Resource:
              Fn::Sub: "${ConfigDeliveryBucket.Arn}/AWSLogs/${AWS::AccountId}/Config/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceAccount:
                  Ref: AWS::AccountId
  ConfigRecorderRole:
    Type: AWS::IAM::Role
    Condition: HasRecorderRegions
    Properties:
      RoleName:
        Fn::Sub: "CloudOpsConfigRecorder-${AWS::AccountId}"
      Tags:
        - Key: Project
          Value: productx
        - Key: Environment
          Value:
            Ref: Environment
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value:
            Ref: Owner
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount:
                  Ref: AWS::AccountId
      ManagedPolicyArns:
        - Fn::Sub: "arn:${AWS::Partition}:iam::aws:policy/service-role/AWS_ConfigRole"
      Policies:
        - PolicyName: DeliverToTheBucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetBucketAcl
                Resource:
                  Fn::GetAtt:
                    - ConfigDeliveryBucket
                    - Arn
              - Effect: Allow
                Action: s3:PutObject
                Resource:
                  Fn::Sub: "${ConfigDeliveryBucket.Arn}/AWSLogs/${AWS::AccountId}/Config/*"
                Condition:
                  StringEquals:
                    s3:x-amz-acl: bucket-owner-full-control
  RecorderStackSetExecutionRole:
    Type: AWS::IAM::Role
    Condition: HasRecorderRegions
    Properties:
      RoleName:
        Fn::Sub: "CloudOpsRecorderStackSetExec-${AWS::AccountId}"
      Tags:
        - Key: Project
          Value: productx
        - Key: Environment
          Value:
            Ref: Environment
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value:
            Ref: Owner
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                Fn::GetAtt:
                  - StackSetAdministrationRole
                  - Arn
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RecorderOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ConfigRecorderAndChannel
                Effect: Allow
                Action:
                  - config:PutConfigurationRecorder
                  - config:DeleteConfigurationRecorder
                  - config:DescribeConfigurationRecorders
                  - config:DescribeConfigurationRecorderStatus
                  - config:StartConfigurationRecorder
                  - config:StopConfigurationRecorder
                  - config:PutDeliveryChannel
                  - config:DeleteDeliveryChannel
                  - config:DescribeDeliveryChannels
                  - config:DescribeDeliveryChannelStatus
                Resource: "*"
              - Sid: PassRecorderRoleToConfig
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CloudOpsConfigRecorder-${AWS::AccountId}"
                Condition:
                  StringEquals:
                    iam:PassedToService: config.amazonaws.com
              - Sid: OwnStackInstances
                Effect: Allow
                Action: "cloudformation:*"
                Resource:
                  Fn::Sub: "arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/StackSet-CloudOpsForwardingRecorder-*/*"
  ForwardingRecorderStackSet:
    Type: AWS::CloudFormation::StackSet
    Condition: HasRecorderRegions
    DependsOn:
      - ConfigDeliveryBucketPolicy
      - ConfigRecorderRole
      - RecorderStackSetExecutionRole
    Properties:
      StackSetName: CloudOpsForwardingRecorder
      Description: "A scoped AWS Config recorder in each region of this account that has none."
      Tags:
        - Key: Project
          Value: productx
        - Key: Environment
          Value:
            Ref: Environment
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value:
            Ref: Owner
      ManagedExecution:
        Active: true
      PermissionModel: SELF_MANAGED
      AdministrationRoleARN:
        Fn::GetAtt:
          - StackSetAdministrationRole
          - Arn
      ExecutionRoleName:
        Fn::Sub: "CloudOpsRecorderStackSetExec-${AWS::AccountId}"
      OperationPreferences:
        RegionConcurrencyType: PARALLEL
        MaxConcurrentCount: 1
        FailureToleranceCount: 0
      Parameters:
        - ParameterKey: DeliveryBucket
          ParameterValue:
            Ref: ConfigDeliveryBucket
      StackInstancesGroup:
        - DeploymentTargets:
            Accounts:
              - Ref: AWS::AccountId
          Regions:
            Ref: CreateRecorderRegions
      TemplateBody: |
        AWSTemplateFormatVersion: "2010-09-09"
        Description: "ProductX Managed Services event forwarding v3: a scoped AWS Config recorder for a region with none (StackSet-deployed)."
        Parameters:
          DeliveryBucket:
            Type: String
        Conditions:
          RecordsGlobalTypes:
            Fn::Equals:
              - Ref: AWS::Region
              - us-east-1
        Resources:
          ConfigRecorder:
            Type: AWS::Config::ConfigurationRecorder
            Properties:
              Name: ProductXCloudOpsRecorder
              RoleARN:
                Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CloudOpsConfigRecorder-${AWS::AccountId}"
              RecordingGroup:
                AllSupported: false
                IncludeGlobalResourceTypes: false
                RecordingStrategy:
                  UseOnly: INCLUSION_BY_RESOURCE_TYPES
                ResourceTypes:
                  Fn::If:
                    - RecordsGlobalTypes
                    - - AWS::EC2::Instance
                      - AWS::EC2::SecurityGroup
                      - AWS::EC2::Subnet
                      - AWS::EC2::VPC
                      - AWS::EC2::Volume
                      - AWS::EC2::RouteTable
                      - AWS::EC2::InternetGateway
                      - AWS::ElasticLoadBalancingV2::LoadBalancer
                      - AWS::ElasticLoadBalancingV2::Listener
                      - AWS::ElasticLoadBalancingV2::TargetGroup
                      - AWS::ACM::Certificate
                      - AWS::Lambda::Function
                      - AWS::RDS::DBInstance
                      - AWS::RDS::DBCluster
                      - AWS::ECS::Cluster
                      - AWS::ECS::Service
                      - AWS::ECS::TaskDefinition
                      - AWS::ApiGateway::RestApi
                      - AWS::ApiGateway::Stage
                      - AWS::ApiGatewayV2::Api
                      - AWS::ApiGatewayV2::Stage
                      - AWS::IAM::Role
                      - AWS::IAM::Policy
                    - - AWS::EC2::Instance
                      - AWS::EC2::SecurityGroup
                      - AWS::EC2::Subnet
                      - AWS::EC2::VPC
                      - AWS::EC2::Volume
                      - AWS::EC2::RouteTable
                      - AWS::EC2::InternetGateway
                      - AWS::ElasticLoadBalancingV2::LoadBalancer
                      - AWS::ElasticLoadBalancingV2::Listener
                      - AWS::ElasticLoadBalancingV2::TargetGroup
                      - AWS::ACM::Certificate
                      - AWS::Lambda::Function
                      - AWS::RDS::DBInstance
                      - AWS::RDS::DBCluster
                      - AWS::ECS::Cluster
                      - AWS::ECS::Service
                      - AWS::ECS::TaskDefinition
                      - AWS::ApiGateway::RestApi
                      - AWS::ApiGateway::Stage
                      - AWS::ApiGatewayV2::Api
                      - AWS::ApiGatewayV2::Stage
              RecordingMode:
                RecordingFrequency: CONTINUOUS
                RecordingModeOverrides:
                  - Description: "An ECS deploy rewrites these: one item a day caps their cost."
                    RecordingFrequency: DAILY
                    ResourceTypes:
                      - AWS::ECS::Service
                      - AWS::ECS::TaskDefinition
          ConfigDeliveryChannel:
            Type: AWS::Config::DeliveryChannel
            DependsOn:
              - ConfigRecorder
            Properties:
              Name: ProductXCloudOpsChannel
              S3BucketName:
                Ref: DeliveryBucket
        Outputs:
          ForwardingVersion:
            Value: "3"
  BudgetAlertTopic:
    Type: AWS::SNS::Topic
    Condition: CreateBudget
    Properties:
      Tags:
        - Key: Project
          Value: productx
        - Key: Environment
          Value:
            Ref: Environment
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value:
            Ref: Owner
  BudgetAlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Condition: CreateBudget
    Properties:
      Topics:
        - Ref: BudgetAlertTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: BudgetsPublish
            Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: SNS:Publish
            Resource:
              Ref: BudgetAlertTopic
            Condition:
              StringEquals:
                aws:SourceAccount:
                  Ref: AWS::AccountId
  BudgetAlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasBudgetAlertEmail
    Properties:
      TopicArn:
        Ref: BudgetAlertTopic
      Protocol: email
      Endpoint:
        Ref: BudgetAlertEmail
  ConfigCostBudget:
    Type: AWS::Budgets::Budget
    Condition: CreateBudget
    DependsOn:
      - BudgetAlertTopicPolicy
    Properties:
      Budget:
        BudgetName:
          Fn::Sub: "CloudOps-Config-${AWS::AccountId}"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount:
            Ref: OnboardingEstimateUsd
          Unit: USD
        CostFilters:
          Service:
            - "AWS Config"
          LinkedAccount:
            - Ref: AWS::AccountId
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 125
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address:
                Ref: BudgetAlertTopic
  ForwardingMemberStackSet:
    Type: AWS::CloudFormation::StackSet
    Condition: IsOrg
    Properties:
      StackSetName: CloudOpsForwardingMemberStackSet
      Description: "Deploys the event-forwarding role to organization member accounts."
      Tags:
        - Key: Project
          Value: productx
        - Key: Environment
          Value:
            Ref: Environment
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value:
            Ref: Owner
      ManagedExecution:
        Active: true
      PermissionModel: SERVICE_MANAGED
      CallAs: SELF
      AutoDeployment:
        Enabled: true
        RetainStacksOnAccountRemoval: false
      Capabilities:
        - CAPABILITY_NAMED_IAM
      OperationPreferences:
        MaxConcurrentCount: 10
        FailureToleranceCount: 5
        RegionConcurrencyType: PARALLEL
      Parameters:
        - ParameterKey: ProductXBusArn
          ParameterValue:
            Ref: ProductXBusArn
        - ParameterKey: Environment
          ParameterValue:
            Ref: Environment
        - ParameterKey: Owner
          ParameterValue:
            Ref: Owner
      StackInstancesGroup:
        - DeploymentTargets:
            OrganizationalUnitIds:
              Fn::Split:
                - ","
                - Ref: TargetOUs
          Regions:
            - Ref: AWS::Region
      TemplateBody: |
        AWSTemplateFormatVersion: "2010-09-09"
        Description: "ProductX Managed Services event forwarding v3: the forwarding role for an organization member account (StackSet-deployed)."
        Parameters:
          ProductXBusArn:
            Type: String
          Environment:
            Type: String
          Owner:
            Type: String
        Resources:
          EventBridgeForwardRole:
            Type: AWS::IAM::Role
            Properties:
              RoleName:
                Fn::Sub: "CloudOpsEventBridgeForward-${AWS::AccountId}"
              Tags:
                - Key: Project
                  Value: productx
                - Key: Environment
                  Value:
                    Ref: Environment
                - Key: ManagedBy
                  Value: cloudformation
                - Key: Owner
                  Value:
                    Ref: Owner
              AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Effect: Allow
                    Principal:
                      Service: events.amazonaws.com
                    Action: sts:AssumeRole
                    Condition:
                      StringEquals:
                        aws:SourceAccount:
                          Ref: AWS::AccountId
                      ArnLike:
                        aws:SourceArn:
                          Fn::Sub: "arn:${AWS::Partition}:events:*:${AWS::AccountId}:rule/ProductXAgent*"
              Policies:
                - PolicyName: CrossAccountPutEvents
                  PolicyDocument:
                    Version: "2012-10-17"
                    Statement:
                      - Effect: Allow
                        Action: events:PutEvents
                        Resource:
                          Ref: ProductXBusArn
        Outputs:
          EventBridgeForwardRoleArn:
            Value:
              Fn::GetAtt:
                - EventBridgeForwardRole
                - Arn
  ForwardingMemberRegionalStackSet:
    Type: AWS::CloudFormation::StackSet
    Condition: IsOrg
    DependsOn:
      - ForwardingMemberStackSet
    Properties:
      StackSetName: CloudOpsForwardingMemberRegional
      Description: "Deploys event-forwarding rules to every forwarded region of organization member accounts."
      Tags:
        - Key: Project
          Value: productx
        - Key: Environment
          Value:
            Ref: Environment
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value:
            Ref: Owner
      ManagedExecution:
        Active: true
      PermissionModel: SERVICE_MANAGED
      CallAs: SELF
      AutoDeployment:
        Enabled: true
        RetainStacksOnAccountRemoval: false
      OperationPreferences:
        MaxConcurrentCount: 10
        FailureToleranceCount: 5
        RegionConcurrencyType: PARALLEL
      Parameters:
        - ParameterKey: ProductXBusArn
          ParameterValue:
            Ref: ProductXBusArn
        - ParameterKey: SecurityHubRegion
          ParameterValue: ""
      StackInstancesGroup:
        - DeploymentTargets:
            OrganizationalUnitIds:
              Fn::Split:
                - ","
                - Ref: TargetOUs
          Regions:
            Ref: ForwardRegions
      TemplateBody: |
        AWSTemplateFormatVersion: "2010-09-09"
        Description: "ProductX Managed Services event forwarding v3: this region's rules (StackSet-deployed)."
        Parameters:
          ProductXBusArn:
            Type: String
          SecurityHubRegion:
            Type: String
            Default: ""
            Description: "The Security Hub finding aggregation region, or empty when the account has no aggregator."
        Conditions:
          ForwardSecurityHub:
            Fn::Or:
              - Fn::Equals:
                  - Ref: SecurityHubRegion
                  - ""
              - Fn::Equals:
                  - Ref: SecurityHubRegion
                  - Ref: AWS::Region
        Resources:
          GuardDutyFindingRule:
            Type: AWS::Events::Rule
            Properties:
              Name: ProductXAgentFwdGuardDuty
              Description: "Feeds: #1-#3 (Incident), #21 (Security findings). GuardDuty findings, severity 7 and above."
              State: ENABLED
              EventPattern:
                source:
                  - aws.guardduty
                detail-type:
                  - "GuardDuty Finding"
                detail:
                  severity:
                    - numeric:
                        - ">="
                        - 7
              Targets:
                - Id: ProductXBusTarget
                  Arn:
                    Ref: ProductXBusArn
                  RoleArn:
                    Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CloudOpsEventBridgeForward-${AWS::AccountId}"
          SecurityHubFindingRule:
            Type: AWS::Events::Rule
            Condition: ForwardSecurityHub
            Properties:
              Name: ProductXAgentFwdSecurityHub
              Description: "Feeds: #21 (Security findings). Critical and High Security Hub V2 findings in any status, so a resolved finding reaches the lake too, except copies of GuardDuty, Inspector and Macie findings (GuardDuty and Macie arrive natively; Inspector is not forwarded)."
              State: ENABLED
              EventPattern:
                source:
                  - aws.securityhub
                detail-type:
                  - "Findings Imported V2"
                detail:
                  findings:
                    severity:
                      - Critical
                      - High
                    metadata:
                      product:
                        name:
                          - anything-but:
                              - GuardDuty
                              - Inspector
                              - Macie
              Targets:
                - Id: ProductXBusTarget
                  Arn:
                    Ref: ProductXBusArn
                  RoleArn:
                    Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CloudOpsEventBridgeForward-${AWS::AccountId}"
          MacieFindingRule:
            Type: AWS::Events::Rule
            Properties:
              Name: ProductXAgentFwdMacie
              Description: "Feeds: #20 (record-only), #21 (Security findings). High-severity Macie findings."
              State: ENABLED
              EventPattern:
                source:
                  - aws.macie
                detail-type:
                  - "Macie Finding"
                detail:
                  severity:
                    description:
                      - High
              Targets:
                - Id: ProductXBusTarget
                  Arn:
                    Ref: ProductXBusArn
                  RoleArn:
                    Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CloudOpsEventBridgeForward-${AWS::AccountId}"
          CloudTrailIncidentRule:
            Type: AWS::Events::Rule
            Properties:
              Name: ProductXAgentFwdCloudTrail
              Description: "Feeds: #9, #10 (Incident). Detection switched off (8 calls) and KMS keys disabled or scheduled for deletion (2 calls), by anyone but an AWS service."
              State: ENABLED
              EventPattern:
                source:
                  - aws.cloudtrail
                  - aws.securityhub
                  - aws.guardduty
                  - aws.config
                  - aws.ec2
                  - aws.kms
                detail-type:
                  - "AWS API Call via CloudTrail"
                detail:
                  userIdentity:
                    type:
                      - anything-but: AWSService
                  eventName:
                    - StopLogging
                    - DeleteTrail
                    - DisableSecurityHub
                    - DeleteDetector
                    - StopConfigurationRecorder
                    - DeleteConfigurationRecorder
                    - DeleteDeliveryChannel
                    - DeleteFlowLogs
                    - ScheduleKeyDeletion
                    - DisableKey
              Targets:
                - Id: ProductXBusTarget
                  Arn:
                    Ref: ProductXBusArn
                  RoleArn:
                    Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CloudOpsEventBridgeForward-${AWS::AccountId}"
          RootSignInRule:
            Type: AWS::Events::Rule
            Properties:
              Name: ProductXAgentFwdRootSignIn
              Description: "Feeds: #11 (Incident). Successful ROOT console sign-ins only. CloudTrail records them in us-east-1, us-east-2 or us-west-2."
              State: ENABLED
              EventPattern:
                source:
                  - aws.signin
                detail-type:
                  - "AWS Console Sign In via CloudTrail"
                  - "AWS Console Signin via CloudTrail"
                detail:
                  eventName:
                    - ConsoleLogin
                  userIdentity:
                    type:
                      - Root
                  responseElements:
                    ConsoleLogin:
                      - Success
              Targets:
                - Id: ProductXBusTarget
                  Arn:
                    Ref: ProductXBusArn
                  RoleArn:
                    Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CloudOpsEventBridgeForward-${AWS::AccountId}"
          CloudWatchAlarmRule:
            Type: AWS::Events::Rule
            Properties:
              Name: ProductXAgentFwdCloudWatchAlarm
              Description: "Feeds: #4 (Incident, alarms chosen in Scope; OK from ALARM closes the card). Target-tracking alarms excluded."
              State: ENABLED
              EventPattern:
                source:
                  - aws.cloudwatch
                detail-type:
                  - "CloudWatch Alarm State Change"
                detail:
                  alarmName:
                    - anything-but:
                        prefix: TargetTracking-
                  "$or":
                    - state:
                        value:
                          - ALARM
                    - state:
                        value:
                          - OK
                      previousState:
                        value:
                          - ALARM
              Targets:
                - Id: ProductXBusTarget
                  Arn:
                    Ref: ProductXBusArn
                  RoleArn:
                    Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CloudOpsEventBridgeForward-${AWS::AccountId}"
          RdsEventRule:
            Type: AWS::Events::Rule
            Properties:
              Name: ProductXAgentFwdRds
              Description: "Feeds: #14-#16 (Incident). RDS failover and low-storage events and the storage-full shutdown (RDS-EVENT-0221/0222); failover completions are absorbed into the open incident card."
              State: ENABLED
              EventPattern:
                source:
                  - aws.rds
                detail-type:
                  - "RDS DB Instance Event"
                  - "RDS DB Cluster Event"
                detail:
                  "$or":
                    - EventCategories:
                        - failover
                        - "low storage"
                    - EventID:
                        - RDS-EVENT-0221
                        - RDS-EVENT-0222
              Targets:
                - Id: ProductXBusTarget
                  Arn:
                    Ref: ProductXBusArn
                  RoleArn:
                    Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CloudOpsEventBridgeForward-${AWS::AccountId}"
          HealthIssueRule:
            Type: AWS::Events::Rule
            Properties:
              Name: ProductXAgentFwdHealth
              Description: "Feeds: #8, #17 (Incident); #27 (record-only, closed at first sighting). AWS Health issues, plus every account risk (exposed or quarantined credentials) and abuse notice whatever its category; a later closed event closes the card."
              State: ENABLED
              EventPattern:
                source:
                  - aws.health
                detail-type:
                  - "AWS Health Event"
                  - "AWS Health Abuse Event"
                detail:
                  "$or":
                    - eventTypeCategory:
                        - issue
                    - service:
                        - RISK
                        - ABUSE
              Targets:
                - Id: ProductXBusTarget
                  Arn:
                    Ref: ProductXBusArn
                  RoleArn:
                    Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CloudOpsEventBridgeForward-${AWS::AccountId}"
          BackupJobRule:
            Type: AWS::Events::Rule
            Properties:
              Name: ProductXAgentFwdBackup
              Description: "Feeds: #18 (Incident, critical tags), #25 (Backup & recovery). Backup jobs failed, aborted or expired; copy jobs failed."
              State: ENABLED
              EventPattern:
                source:
                  - aws.backup
                detail-type:
                  - "Backup Job State Change"
                  - "Copy Job State Change"
                detail:
                  state:
                    - FAILED
                    - ABORTED
                    - EXPIRED
              Targets:
                - Id: ProductXBusTarget
                  Arn:
                    Ref: ProductXBusArn
                  RoleArn:
                    Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CloudOpsEventBridgeForward-${AWS::AccountId}"
          ConfigItemChangeRule:
            Type: AWS::Events::Rule
            Properties:
              Name: ProductXAgentFwdConfigItem
              Description: "Feeds: the lake (Bind: resources, facts, edge facts). Config item changes of the recorded types, oversized notifications included."
              State: ENABLED
              EventPattern:
                source:
                  - aws.config
                detail-type:
                  - "Config Configuration Item Change"
                detail:
                  messageType:
                    - ConfigurationItemChangeNotification
                    - OversizedConfigurationItemChangeNotification
                  "$or":
                    - configurationItem:
                        resourceType:
                          - AWS::EC2::Instance
                          - AWS::EC2::SecurityGroup
                          - AWS::EC2::Subnet
                          - AWS::EC2::VPC
                          - AWS::EC2::Volume
                          - AWS::EC2::RouteTable
                          - AWS::EC2::InternetGateway
                          - AWS::ElasticLoadBalancingV2::LoadBalancer
                          - AWS::ElasticLoadBalancingV2::Listener
                          - AWS::ElasticLoadBalancingV2::TargetGroup
                          - AWS::ACM::Certificate
                          - AWS::Lambda::Function
                          - AWS::RDS::DBInstance
                          - AWS::RDS::DBCluster
                          - AWS::ECS::Cluster
                          - AWS::ECS::Service
                          - AWS::ECS::TaskDefinition
                          - AWS::ApiGateway::RestApi
                          - AWS::ApiGateway::Stage
                          - AWS::ApiGatewayV2::Api
                          - AWS::ApiGatewayV2::Stage
                          - AWS::IAM::Role
                          - AWS::IAM::Policy
                    - configurationItemSummary:
                        resourceType:
                          - AWS::EC2::Instance
                          - AWS::EC2::SecurityGroup
                          - AWS::EC2::Subnet
                          - AWS::EC2::VPC
                          - AWS::EC2::Volume
                          - AWS::EC2::RouteTable
                          - AWS::EC2::InternetGateway
                          - AWS::ElasticLoadBalancingV2::LoadBalancer
                          - AWS::ElasticLoadBalancingV2::Listener
                          - AWS::ElasticLoadBalancingV2::TargetGroup
                          - AWS::ACM::Certificate
                          - AWS::Lambda::Function
                          - AWS::RDS::DBInstance
                          - AWS::RDS::DBCluster
                          - AWS::ECS::Cluster
                          - AWS::ECS::Service
                          - AWS::ECS::TaskDefinition
                          - AWS::ApiGateway::RestApi
                          - AWS::ApiGateway::Stage
                          - AWS::ApiGatewayV2::Api
                          - AWS::ApiGatewayV2::Stage
                          - AWS::IAM::Role
                          - AWS::IAM::Policy
              Targets:
                - Id: ProductXBusTarget
                  Arn:
                    Ref: ProductXBusArn
                  RoleArn:
                    Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CloudOpsEventBridgeForward-${AWS::AccountId}"
          ConfigComplianceChangeRule:
            Type: AWS::Events::Rule
            Properties:
              Name: ProductXAgentFwdConfigCompliance
              Description: "Feeds: the lake (compliance facts, both directions). Config rule compliance changes, except the rules Security Hub creates for its controls: those arrive as Security Hub findings."
              State: ENABLED
              EventPattern:
                source:
                  - aws.config
                detail-type:
                  - "Config Rules Compliance Change"
                detail:
                  configRuleName:
                    - anything-but:
                        prefix: securityhub-
              Targets:
                - Id: ProductXBusTarget
                  Arn:
                    Ref: ProductXBusArn
                  RoleArn:
                    Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CloudOpsEventBridgeForward-${AWS::AccountId}"
          SsmComplianceRule:
            Type: AWS::Events::Rule
            Properties:
              Name: ProductXAgentFwdSsmCompliance
              Description: "Feeds: the lake (patch and association compliance facts, both directions). SSM compliance state changes."
              State: ENABLED
              EventPattern:
                source:
                  - aws.ssm
                detail-type:
                  - "Configuration Compliance State Change"
                detail:
                  compliance-status:
                    - non_compliant
                    - compliant
              Targets:
                - Id: ProductXBusTarget
                  Arn:
                    Ref: ProductXBusArn
                  RoleArn:
                    Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CloudOpsEventBridgeForward-${AWS::AccountId}"
        Outputs:
          ForwardingVersion:
            Value: "3"
Outputs:
  EventBridgeForwardRoleArn:
    Value:
      Fn::GetAtt:
        - EventBridgeForwardRole
        - Arn
  TemplateProfile:
    Description: "Which ProductX customer template this stack was deployed from"
    Value: managed_services_forwarding
  ProductXBusArn:
    Description: "The platform bus ARN this stack forwards events to"
    Value:
      Ref: ProductXBusArn
  ForwardingVersion:
    Description: "The forwarding template version; ProductX offers an update when a newer one is published"
    Value: "3"
