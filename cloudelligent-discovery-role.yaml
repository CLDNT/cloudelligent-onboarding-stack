                  - kinesisvideo:GetImages
                  - kinesisvideo:Get*StreamingSessionURL
                  - sqs:ReceiveMessage
                  - iot:GetThingShadow
                  - iot:GetRetainedMessage
                  - iotsitewise:GetQueryResults
                  - iotwireless:Get*Position
                  - chime:GetChannelMessage
                  - chime:RetrieveDataExports
                  - ses:GetArchiveMessage*
                  - ses:GetArchiveSearchResults
                  - ses:GetMessageInsights
                  - ses:GetContact
                  - sns:GetEndpointAttributes
                  - sns:ListPhoneNumbersOptedOut
                  - sms-voice:DescribeOptedOutNumbers
                  - ses:GetSuppressedDestination
                  - ses:GetMemberOfAddressList
                  - iotsitewise:Get*AssetProperty*
                  - mobiletargeting:Get*Endpoint*
                  - chime:GetProxySession
                  - chime:ListProxySessions
                  - connect:DescribeContact
                  - connect:DescribeContactEvaluation
                  - connect:GetContactAttributes
                  - lex:GetSession
                  - lex:GetUtterancesView
                  - ssm-incidents:GetIncidentRecord
                  - tax:GetTaxRegistrationDocument
                  - cognito-idp:AdminGetUser
