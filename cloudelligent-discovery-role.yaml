                          - dynamodb:SearchVectors
                          - ssm:GetParameter
                          - ssm:GetParameters
                          - ssm:GetParametersByPath
                          - ssm:GetParameterHistory
                          - dax:Query
                          - dax:Scan
                          - cassandra:Select
                          - qldb:GetBlock
                          - qldb:GetRevision
                          - sdb:Select
                          - es:ESHttpGet
                          - healthlake:ReadResource
                          - healthlake:SearchWith*
