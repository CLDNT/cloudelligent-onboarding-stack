                  - rekognition:GetContentModeration
                  - rekognition:GetFaceSearch
                  - rekognition:GetPersonTracking
                  - rekognition:Search*
                  - rekognition:ListFaces
                  - lookoutmetrics:GetSampleData
                  - forecast:Query*
                  - frauddetector:GetEvent
                  - frauddetector:GetListElements
                  - swf:GetWorkflowExecutionHistory
                  - bedrock-agentcore:GetEvent
                  - bedrock-agentcore:GetMemoryRecord
                  - bedrock-agentcore:RetrieveMemoryRecords
                  - translate:Get*
                  - bedrock:GetAutomatedReasoningPolicyBuildWorkflowResultAssets
                  - lambda:GetDurableExecution*
                  - bedrock-mantle:GetFile
                  - bedrock-mantle:GetInference
                  - codecommit:GitPull
                  - codecommit:GetBlob*
                  - codecommit:GetFile
                  - codecommit:GetComment
                  - codecommit:GetComments*
                  - codeartifact:ReadFromRepository
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - lambda:GetFunction
                  - lambda:GetLayerVersion
                  - cloudfront:Get*Function
                  - cloudfront-keyvaluestore:ListKeys
                  - inspector2:BatchGetCodeSnippet
                  - securityagent:GetArtifact
                  - securityagent:GetDesignReviewArtifact
                  - eks:AccessKubernetesApi
                  - codeartifact:GetPackageVersion*
                  - codecommit:*DescribeMergeConflicts
                  - codeartifact:GetAuthorizationToken
                  - cognito-idp:GetClientToken
                  - connect:GetFederationToken
                  - appsync:ListApiKeys
                  - acm:GetAcmeExternalAccountBindingCredentials
                  - license-manager:GetAccessToken
                Resource: '*'
              - Sid: DenyApiGatewayKeyReads
                Effect: Deny
                Action:
                  - apigateway:GET
                Resource:
                  - arn:aws:apigateway:*::/apikeys
                  - arn:aws:apigateway:*::/apikeys/*
                  - arn:aws:apigateway:*::/usageplans/*/keys*
              - Sid: DenyS3ObjectDataReads
                Effect: Deny
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetObjectVersionForReplication
                  - s3:GetObject*Annotation*
                NotResource:
                  - !Sub arn:aws:s3:::cloudelligentdiscovery-cur-${AWS::AccountId}
                  - !Sub arn:aws:s3:::cloudelligentdiscovery-cur-${AWS::AccountId}/*
                  - !If
                    - HasExistingCURBucket
                    - !Sub arn:aws:s3:::${ExistingCURBucket}
                    - !Ref AWS::NoValue
                  - !If
                    - HasExistingCURBucket
                    - !Sub arn:aws:s3:::${ExistingCURBucket}/*
                    - !Ref AWS::NoValue
        - PolicyName: CurPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cur:DescribeReportDefinitions
                Resource: '*'
              - Effect: Allow
                Action:
                  - cur:PutReportDefinition
                  - cur:ModifyReportDefinition
                  - cur:DeleteReportDefinition
                Resource: arn:aws:cur:*:*:definition/cloudelligentdiscovery-*
              - Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:HeadBucket
                  - s3:GetBucketLocation
                  - s3:GetBucketPolicy
                  - s3:PutBucketPolicy
                Resource: arn:aws:s3:::cloudelligentdiscovery-cur-*
              - Effect: Allow
                Action:
                  - s3:ListAllMyBuckets
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !Sub arn:aws:s3:::cloudelligentdiscovery-cur-${AWS::AccountId}
                  - !Sub arn:aws:s3:::cloudelligentdiscovery-cur-${AWS::AccountId}/*
        - !If
          - HasExistingCURBucket
          - PolicyName: ReadExistingCURBucket
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:ListBucket
                    - s3:GetBucketLocation
                  Resource:
                    - !Sub arn:aws:s3:::${ExistingCURBucket}
                    - !Sub arn:aws:s3:::${ExistingCURBucket}/*
          - !Ref AWS::NoValue
        - !If
          - IsOrg
          - PolicyName: CloudelligentDiscoveryAssumeMemberRoles
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: sts:AssumeRole
                  Resource: arn:aws:iam::*:role/CloudelligentDiscoveryRole
                  Condition:
                    StringEquals:
                      sts:ExternalId: !Ref ExternalId
                      aws:ResourceOrgID: ${aws:PrincipalOrgID}
          - !Ref AWS::NoValue
  
  

  CloudelligentDiscoveryRoleStackSet:
    Type: AWS::CloudFormation::StackSet
    Condition: IsOrg
    DependsOn: CloudelligentDiscoveryRole
    Properties:
      StackSetName: CloudelligentDiscoveryRoleStackSet
      Description: Deploys CloudelligentDiscoveryRole to organization member accounts.
      PermissionModel: SERVICE_MANAGED
      CallAs: SELF
      AutoDeployment:
        Enabled: true
        RetainStacksOnAccountRemoval: false
      Capabilities:
        - CAPABILITY_NAMED_IAM

      ManagedExecution:
        Active: true
      OperationPreferences:
        MaxConcurrentCount: 10
        FailureToleranceCount: 5
        RegionConcurrencyType: PARALLEL
      Parameters:
        - ParameterKey: ManagementAccountId
          ParameterValue: !Ref AWS::AccountId
        - ParameterKey: ExternalId
          ParameterValue: !Ref ExternalId
      StackInstancesGroup:
        - DeploymentTargets:
            OrganizationalUnitIds: !Split
              - ','
              - !Ref TargetOUs
          Regions:
            - !Ref AWS::Region
      TemplateBody: |
        AWSTemplateFormatVersion: '2010-09-09'
        

        Parameters:
          ManagementAccountId:
            Type: String
          ExternalId:
            Type: String
            NoEcho: true

        Resources:
