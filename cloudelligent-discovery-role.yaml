                        Effect: Allow
                        Action:
                          - wellarchitected:UpdateAnswer
                        Resource: '*'
                      - Sid: MilestoneManagement
                        Effect: Allow
                        Action:
                          - wellarchitected:CreateMilestone
                        Resource: '*'
                - PolicyName: DataPlaneReadDeny
                  PolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                      - Sid: DenyCustomerDataPlaneReads
                        Effect: Deny
