AWSTemplateFormatVersion: '2010-09-09'

Parameters:
  TrustedAccountId:
    Type: String
    Default: '180528248662'
    Description: Cloudelligent platform AWS account ID permitted to assume this role.
  ExternalId:
    Type: String
    NoEcho: true
  EnableOrganizations:
    Type: String
    Default: 'no'
    AllowedValues:
      - 'yes'
      - 'no'
    Description: Set to 'yes' if this account is an AWS Organizations management
      account and you want to scan member accounts too.
  TargetOUs:
    Type: String
    Default: ''
    AllowedPattern: ^$|^(ou|r)-[a-z0-9-]+(,(ou|r)-[a-z0-9-]+)*$
    ConstraintDescription: Must be empty (single-account mode) or a comma-separated
      list of OU ids starting with ou- or r- (e.g. r-abc1 or
      ou-abc1-12abcdef,ou-abc1-34ghijkl).
    Description: Required to cover all accounts in the organization

  ExistingCURBucket:
    Type: String
    Default: ''
    AllowedPattern: ^$|^[a-z0-9.\-]{3,63}$
    ConstraintDescription: Single S3 bucket name (DNS-compliant, 3-63 chars).

Rules:
  TargetOUsRequiredForOrg:
    RuleCondition: !Equals
      - !Ref EnableOrganizations
      - 'yes'
    Assertions:
      - Assert: !Not
          - !Equals
            - !Ref TargetOUs
            - ''
        AssertDescription: TargetOUs is required when EnableOrganizations=yes. Provide
          the root OU id (r-xxxx) for all accounts, or specific OU ids
          (ou-xxxx-xxxxxxxx) comma-separated.

Conditions:
  IsOrg: !Equals
    - !Ref EnableOrganizations
    - 'yes'
  HasExistingCURBucket: !Not
    - !Equals
      - !Ref ExistingCURBucket
      - ''

Resources:
  CloudelligentDiscoveryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CloudelligentDiscoveryRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${TrustedAccountId}:root
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
          - Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${TrustedAccountId}:user/billingviewer
            Action: sts:AssumeRole
          - Effect: Allow
            Principal:
              AWS: '282762468439'
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: 9ba55e7ffef3c1611a511bbbdadbcdbff662b8d9
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/SecurityAudit
        - arn:aws:iam::aws:policy/ReadOnlyAccess
      Policies:
        - PolicyName: WellarchitectedPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WorkloadLifecycle
                Effect: Allow
                Action:
                  - wellarchitected:CreateWorkload
                  - wellarchitected:UpdateWorkload
                Resource: '*'
              - Sid: AnswerManagement
                Effect: Allow
                Action:
                  - wellarchitected:UpdateAnswer
                Resource:
                  - !Sub arn:aws:wellarchitected:*:${AWS::AccountId}:workload/*
              - Sid: MilestoneManagement
                Effect: Allow
                Action:
                  - wellarchitected:CreateMilestone
                Resource:
                  - !Sub arn:aws:wellarchitected:*:${AWS::AccountId}:workload/*

        - PolicyName: DenyCustomerDataReads
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DenyCustomerDataReads
                Effect: Deny
                Action:
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:PartiQLSelect
                  - dynamodb:GetRecords
                  - dynamodb:ReadDataForReplication
                  - dynamodb:SearchVectors
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                  - ssm:GetParameterHistory
                  - dax:Query
                  - dax:Scan
                  - cassandra:Select
                  - qldb:GetBlock
                  - qldb:GetRevision
                  - sdb:Select
                  - es:ESHttpGet
                  - healthlake:ReadResource
                  - healthlake:SearchWith*
                  - s3tables:GetTableData
                  - s3vectors:GetVectors
                  - dynamodb:*GetItem
                  - dax:*GetItem
                  - athena:GetQueryResults*
                  - glue:GetStatement
                  - rds:Download*
                  - quicksight:DescribeDashboardSnapshotJobResult
                  - logs:GetLogEvents
                  - logs:FilterLogEvents
                  - logs:GetLogRecord
                  - logs:GetQueryResults
                  - logs:StartLiveTail
                  - logs:GetLookupTable
                  - cloudwatch:GetRecords
                  - cloudwatch:GetTelemetryQueryResults
                  - cloudwatch:GenerateQueryResultsSummary
                  - rum:GetAppMonitorData
                  - ssm:GetCommandInvocation
                  - elasticbeanstalk:RetrieveEnvironmentInfo
                  - wafv2:GetSampledRequests
                  - waf:GetSampledRequests
                  - waf-regional:GetSampledRequests
                  - logs:ListAnomalies
                  - ssm:GetAutomationExecution
                  - xray:*Traces
                  - amplify:GetJob
                  - amplify:GetApp
                  - amplify:GetBranch
                  - applicationinsights:Describe*Observation*
                  - logs:DescribeQuer*
                  - s3express:CreateSession
                  - mediastore:GetObject
                  - mediapackagev2:GetObject
                  - workdocs:GetDocument*
                  - snowball:GetJobUnlockCode
                  - iotanalytics:GetDatasetContent
                  - iotanalytics:SampleChannelData
