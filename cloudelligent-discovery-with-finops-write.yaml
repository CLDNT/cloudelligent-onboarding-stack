AWSTemplateFormatVersion: '2010-09-09'

Parameters:
  TrustedAccountId:
    Type: String
    Default: '180528248662'
    Description: Cloudelligent platform AWS account ID permitted to assume this role.
  ExternalId:
    Type: String
    NoEcho: true
  EnableOrganizations:
    Type: String
    Default: 'no'
    AllowedValues:
      - 'yes'
      - 'no'
    Description: Set to 'yes' if this account is an AWS Organizations management
      account and you want to scan member accounts too.
  TargetOUs:
    Type: String
    Default: ''
    AllowedPattern: ^$|^(ou|r)-[a-z0-9-]+(,(ou|r)-[a-z0-9-]+)*$
    ConstraintDescription: Must be empty (single-account mode) or a comma-separated
      list of OU ids starting with ou- or r- (e.g. r-abc1 or
      ou-abc1-12abcdef,ou-abc1-34ghijkl).
    Description: Required to cover all accounts in the organization

  ExistingCURBucket:
    Type: String
    Default: ''
    AllowedPattern: ^$|^[a-z0-9.\-]{3,63}$
    ConstraintDescription: Single S3 bucket name (DNS-compliant, 3-63 chars).

Rules:
  TargetOUsRequiredForOrg:
    RuleCondition: !Equals
      - !Ref EnableOrganizations
      - 'yes'
    Assertions:
      - Assert: !Not
          - !Equals
            - !Ref TargetOUs
            - ''
        AssertDescription: TargetOUs is required when EnableOrganizations=yes. Provide
          the root OU id (r-xxxx) for all accounts, or specific OU ids
          (ou-xxxx-xxxxxxxx) comma-separated.

Conditions:
  IsOrg: !Equals
    - !Ref EnableOrganizations
    - 'yes'
  HasExistingCURBucket: !Not
    - !Equals
      - !Ref ExistingCURBucket
      - ''

Resources:
  CloudelligentDiscoveryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CloudelligentDiscoveryRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${TrustedAccountId}:root
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
          - Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${TrustedAccountId}:user/billingviewer
            Action: sts:AssumeRole
          - Effect: Allow
            Principal:
              AWS: '282762468439'
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: 9ba55e7ffef3c1611a511bbbdadbcdbff662b8d9
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/SecurityAudit
        - arn:aws:iam::aws:policy/ReadOnlyAccess
      Policies:
        - PolicyName: WellarchitectedPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WorkloadLifecycle
                Effect: Allow
                Action:
                  - wellarchitected:CreateWorkload
                  - wellarchitected:UpdateWorkload
                Resource: '*'
              - Sid: AnswerManagement
                Effect: Allow
                Action:
                  - wellarchitected:UpdateAnswer
                Resource:
                  - !Sub arn:aws:wellarchitected:*:${AWS::AccountId}:workload/*
              - Sid: MilestoneManagement
                Effect: Allow
                Action:
                  - wellarchitected:CreateMilestone
                Resource:
                  - !Sub arn:aws:wellarchitected:*:${AWS::AccountId}:workload/*

        - PolicyName: DenyCustomerDataReads
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DenyCustomerDataReads
                Effect: Deny
                Action:
                  - s3-object-lambda:GetObject
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:PartiQLSelect
                  - dax:GetItem
                  - dax:BatchGetItem
                  - dax:Query
                  - dax:Scan
                  - es:ESHttpGet
                  - es:ESHttpHead
                  - cassandra:Select
                  - qldb:GetBlock
                  - qldb:GetRevision
                  - qldb:GetDigest
                Resource: '*'
        - PolicyName: CurPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cur:DescribeReportDefinitions
                Resource: '*'
              - Effect: Allow
                Action:
                  - cur:PutReportDefinition
                  - cur:ModifyReportDefinition
                  - cur:DeleteReportDefinition
                Resource: arn:aws:cur:*:*:definition/cloudelligentdiscovery-*
              - Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:HeadBucket
                  - s3:GetBucketLocation
                  - s3:GetBucketPolicy
                  - s3:PutBucketPolicy
                Resource: arn:aws:s3:::cloudelligentdiscovery-cur-*
              - Effect: Allow
                Action:
                  - s3:ListAllMyBuckets
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !Sub arn:aws:s3:::cloudelligentdiscovery-cur-${AWS::AccountId}
                  - !Sub arn:aws:s3:::cloudelligentdiscovery-cur-${AWS::AccountId}/*
        - !If
          - HasExistingCURBucket
          - PolicyName: ReadExistingCURBucket
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:ListBucket
                    - s3:GetBucketLocation
                  Resource:
                    - !Sub arn:aws:s3:::${ExistingCURBucket}
                    - !Sub arn:aws:s3:::${ExistingCURBucket}/*
          - !Ref AWS::NoValue
        - !If
          - IsOrg
          - PolicyName: CloudelligentDiscoveryAssumeMemberRoles
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: sts:AssumeRole
                  Resource: arn:aws:iam::*:role/CloudelligentDiscoveryRole
                  Condition:
                    StringEquals:
                      sts:ExternalId: !Ref ExternalId
                      aws:ResourceOrgID: ${aws:PrincipalOrgID}
          - !Ref AWS::NoValue
  
  CloudelligentFinOpsRole: 
    Type: AWS::IAM::Role
    Properties:
      RoleName: ReservedAI-Write
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: arn:aws:iam::967800896805:user/reserved-write
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: "8ab6faee-ffc1-4302-93a3-98daf7178208"
      Policies:
        - PolicyName: ReservedAI-Write
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - 'ce:*'
                  - 'pricing:*'
                  - 'sts:GetCallerIdentity'
                  - 'servicequotas:GetServiceQuota'
                  - 'servicequotas:GetRequestedServiceQuotaChange'
                  - 'servicequotas:GetAWSDefaultServiceQuota'
                  - 'servicequotas:ListServices'
                  - 'servicequotas:ListServiceQuotas'
                  - 'servicequotas:ListRequestedServiceQuotaChangeHistoryByQuota'
                  - 'servicequotas:RequestServiceQuotaIncrease'
                  - 'cloudtrail:LookupEvents'
                  - 'cur:DescribeReportDefinitions'
                  - 'ec2:DescribeAccountAttributes'
                  - 'ec2:DescribeInstances'
                  - 'ec2:DescribeRegions'
                  - 'ec2:DescribeAvailabilityZones'
                  - 'ec2:CreateSpotDatafeedSubscription'
                  - 'ec2:DescribeSpotDatafeedSubscription'
                  - 'ec2:DescribeSpotFleetInstances'
                  - 'ec2:DescribeSpotFleetRequestHistory'
                  - 'ec2:DescribeSpotFleetRequests'
                  - 'ec2:DescribeSpotInstanceRequests'
                  - 'ec2:DescribeSpotPriceHistory'
                  - 'ec2:DescribeFleetHistory'
                  - 'ec2:DescribeFleetInstances'
                  - 'ec2:DescribeFleets'
                  - 'ec2:DescribeTags'
                  - 'tag:GetResources'
                  - 'resource-groups:GetGroupQuery'
                  - 'resource-groups:SearchResources'
                  - 'resource-groups:GetGroup'
                  - 'resource-groups:GetGroupConfiguration'
                  - 'resource-groups:GetTags'
                  - 'resource-groups:ListGroupResources'
                  - 'resource-groups:ListGroups'
                  - 'ec2:DescribeAddresses'
                  - 'ec2:DescribeMovingAddresses'
                  - 'ec2:DescribeVolumes'
                  - 'ec2:DescribeVolumesModifications'
                  - 'ec2:DescribeVolumeStatus'
                  - 'ec2:DescribeElasticGpus'
                  - 'ec2:DescribeScheduledInstances'
                  - 'ec2:DescribeScheduledInstanceAvailability'
                  - 'ec2:DescribeReservedInstances'
                  - 'ec2:DescribeReservedInstancesModifications'
                  - 'ec2:DescribeReservedInstancesListings'
                  - 'ec2:GetReservedInstancesExchangeQuote'
                  - 'ec2:DescribeReservedInstancesOfferings'
                  - 'ec2:DescribeCapacityReservations'
                  - 'ec2:DescribeHosts'
                  - 'ec2:DescribeHostReservations'
                  - 'ec2:GetHostReservationPurchasePreview'
                  - 'ec2:DescribeHostReservationOfferings'
                  - 'ec2:DescribeCapacityBlockOfferings'
                  - 'organizations:DescribeOrganization'
                  - 'organizations:ListAccounts'
                  - 'organizations:DescribeAccount'
                  - 'savingsplans:DescribeSavingsPlansOfferingRates'
                  - 'savingsplans:DescribeSavingsPlansOfferings'
                  - 'savingsplans:DescribeSavingsPlans'
                  - 'savingsplans:DescribeSavingsPlanRates'
                  - 'rds:DescribeReservedDBInstances'
                  - 'rds:DescribeReservedDBInstancesOfferings'
                  - 'redshift:DescribeReservedNodeOfferings'
                  - 'redshift:DescribeReservedNodes'
                  - 'dynamodb:DescribeReservedCapacity'
                  - 'dynamodb:DescribeReservedCapacityOfferings'
                  - 'elasticache:DescribeReservedCacheNodes'
                  - 'elasticache:DescribeReservedCacheNodesOfferings'
                  - 'memorydb:DescribeReservedNodes'
                  - 'memorydb:DescribeReservedNodesOfferings'
                  - 'es:DescribeReservedElasticsearchInstanceOfferings'
                  - 'es:DescribeReservedElasticsearchInstances'
                  - 'ec2:ModifyReservedInstances'
                  - 'ec2:PurchaseReservedInstancesOffering'
                  - 'ec2:AcceptReservedInstancesExchangeQuote'
                  - 'ec2:CreateReservedInstancesListing'
                  - 'ec2:CancelReservedInstancesListing'
                  - 'ec2:PurchaseScheduledInstances'
                  - 'ec2:RunScheduledInstances'
                  - 'ec2:ModifyCapacityReservation'
                  - 'ec2:ModifyInstanceCapacityReservationAttributes'
                  - 'ec2:CreateCapacityReservation'
                  - 'ec2:CancelCapacityReservation'
                  - 'ec2:PurchaseHostReservation'
                  - 'elasticache:PurchaseReservedCacheNodesOffering'
                  - 'memorydb:PurchaseReservedNodesOffering'
                  - 'rds:PurchaseReservedDbInstancesOffering'
                  - 'redshift:PurchaseReservedNodeOffering'
                  - 'redshift:AcceptReservedNodeExchange'
                  - 'es:PurchaseReservedElasticsearchInstanceOffering'
                  - 'savingsplans:CreateSavingsPlan'
                  - 'savingsplans:DeleteQueuedSavingsPlan'
                  - 'organizations:InviteAccountToOrganization'
                  - 'organizations:RemoveAccountFromOrganization'
                  - 'organizations:CreateAccount'
                  - 'organizations:MoveAccount'
                Resource:
                  - '*'
              - Effect: Allow
                Action:
                  - iam:CreateServiceLinkedRole
                Resource:
                  - arn:aws:iam::*:role/aws-service-role/*
              - Effect: Allow
                Action:
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:SimulatePrincipalPolicy
                Resource:
                  - arn:aws:iam::*:role/ReservedAI-Write
              - Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:ListBucket
                  - s3:PutBucketPolicy
                Resource:
                  - arn:aws:s3:::reserved-ai-cur-*
                  - arn:aws:s3:::reserved-ai-spot-*
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - arn:aws:s3:::reserved-ai-cur-*/*
                  - arn:aws:s3:::reserved-ai-spot-*/*
              - Effect: Allow
                Action:
                  - cur:PutReportDefinition
                Resource:
                  - arn:aws:cur:*:*:definition/reserved-ai-*

  CloudelligentDiscoveryRoleStackSet:
    Type: AWS::CloudFormation::StackSet
    Condition: IsOrg
    DependsOn: CloudelligentDiscoveryRole
    Properties:
      StackSetName: CloudelligentDiscoveryRoleStackSet
      Description: Deploys CloudelligentDiscoveryRole to organization member accounts.
      PermissionModel: SERVICE_MANAGED
      CallAs: SELF
      AutoDeployment:
        Enabled: true
        RetainStacksOnAccountRemoval: false
      Capabilities:
        - CAPABILITY_NAMED_IAM

      ManagedExecution:
        Active: true
      OperationPreferences:
        MaxConcurrentCount: 10
        FailureToleranceCount: 5
        RegionConcurrencyType: PARALLEL
      Parameters:
        - ParameterKey: ManagementAccountId
          ParameterValue: !Ref AWS::AccountId
        - ParameterKey: ExternalId
          ParameterValue: !Ref ExternalId
      StackInstancesGroup:
        - DeploymentTargets:
            OrganizationalUnitIds: !Split
              - ','
              - !Ref TargetOUs
          Regions:
            - !Ref AWS::Region
      TemplateBody: |
        AWSTemplateFormatVersion: '2010-09-09'
        

        Parameters:
          ManagementAccountId:
            Type: String
          ExternalId:
            Type: String
            NoEcho: true

        Resources:
          CloudelligentDiscoveryRole:
            Type: AWS::IAM::Role
            Properties:
              RoleName: CloudelligentDiscoveryRole
              AssumeRolePolicyDocument:
                Version: '2012-10-17'
                Statement:
                  - Effect: Allow
                    Principal:
                      AWS: !Sub 'arn:aws:iam::${ManagementAccountId}:root'
                    Action: sts:AssumeRole
                    Condition:
                      StringEquals:
                        sts:ExternalId: !Ref ExternalId
                        aws:PrincipalArn: !Sub 'arn:aws:iam::${ManagementAccountId}:role/CloudelligentDiscoveryRole'
                  - Effect: Allow
                    Principal:
                      AWS: "282762468439"
                    Action: sts:AssumeRole
                    Condition:
                      StringEquals:
                        sts:ExternalId: "9ba55e7ffef3c1611a511bbbdadbcdbff662b8d9"
              ManagedPolicyArns:
                - arn:aws:iam::aws:policy/SecurityAudit
                - arn:aws:iam::aws:policy/ReadOnlyAccess
              Policies:
                - PolicyName: WellarchitectedPolicy
                  PolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                      - Sid: WorkloadLifecycle
                        Effect: Allow
                        Action:
                          - wellarchitected:CreateWorkload
                          - wellarchitected:UpdateWorkload
                          - wellarchitected:DeleteWorkload
                        Resource: '*'
                      - Sid: AnswerManagement
                        Effect: Allow
                        Action:
                          - wellarchitected:UpdateAnswer
                        Resource: '*'
                      - Sid: MilestoneManagement
                        Effect: Allow
                        Action:
                          - wellarchitected:CreateMilestone
                        Resource: '*'
                - PolicyName: DataPlaneReadDeny
                  PolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                      - Sid: DenyCustomerDataPlaneReads
                        Effect: Deny
                        Action:
                          - s3-object-lambda:GetObject
                          - dynamodb:Query
                          - dynamodb:Scan
                          - dynamodb:PartiQLSelect
                          - dax:GetItem
                          - dax:BatchGetItem
                          - dax:Query
                          - dax:Scan
                          - es:ESHttpGet
                          - es:ESHttpHead
                          - cassandra:Select
                          - qldb:GetBlock
                          - qldb:GetRevision
                          - qldb:GetDigest
                        Resource: '*'

        Outputs:
          MemberRoleArn:
            Value: !GetAtt CloudelligentDiscoveryRole.Arn

Outputs:
  RoleArn:
    Value: !GetAtt CloudelligentDiscoveryRole.Arn